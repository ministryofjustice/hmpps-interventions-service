name: Pipeline [test -> build -> deploy]

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on branches; on main/hotfix keep every run (helm deploys lock the namespace).
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/hotfix/')) && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/hotfix/') }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: interventions_ci
      POSTGRES_PASSWORD: password
      _JAVA_OPTIONS: -Xmx2g -XX:ParallelGCThreads=2 -XX:ConcGCThreads=2 -Djava.util.concurrent.ForkJoinPool.common.parallelism=2 -Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: interventions_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: ./.github/actions/setup-flyway
      - name: Run migrations and local seeds
        run: |
          flyway -cleanDisabled="false" clean -url="jdbc:postgresql://localhost:5432/$POSTGRES_DB" -user="postgres" -password="$POSTGRES_PASSWORD"
          flyway migrate -url="jdbc:postgresql://localhost:5432/$POSTGRES_DB" -user="postgres" -password="$POSTGRES_PASSWORD" -locations="src/main/resources/db/migration,src/main/resources/db/local" -postgresql.transactional.lock=false
      - name: Run checks and coverage verification
        run: ./gradlew check jacocoTestCoverageVerification
      - name: Upload test results and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            build/test-results
            build/reports/tests
            build/reports/jacoco/test
          if-no-files-found: ignore

  validate_db:
    name: Validate database migrations
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: interventions_ci
      POSTGRES_PASSWORD: password
      PGPASSWORD: password
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: interventions_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-flyway
      - name: Run main migrations then branch migrations to detect clashes
        run: |
          url="jdbc:postgresql://localhost:5432/$POSTGRES_DB"
          flyway -cleanDisabled="false" clean -url="$url" -user="postgres" -password="$POSTGRES_PASSWORD"
          git checkout --force origin/main
          flyway migrate -url="$url" -user="postgres" -password="$POSTGRES_PASSWORD" -locations="src/main/resources/db/migration" -postgresql.transactional.lock=false
          git checkout --force "$GITHUB_SHA"
          flyway migrate -url="$url" -user="postgres" -password="$POSTGRES_PASSWORD" -locations="src/main/resources/db/migration" -postgresql.transactional.lock=false
      - name: Run migrations and local seeds
        run: |
          url="jdbc:postgresql://localhost:5432/$POSTGRES_DB"
          flyway -cleanDisabled="false" clean -url="$url" -user="postgres" -password="$POSTGRES_PASSWORD"
          flyway migrate -url="$url" -user="postgres" -password="$POSTGRES_PASSWORD" -locations="src/main/resources/db/migration,src/main/resources/db/local" -postgresql.transactional.lock=false
      - name: Validate metadata
        run: script/validate-metadata.sh

  helm_lint:
    name: Helm lint (${{ matrix.environment }})
    strategy:
      matrix:
        environment: [dev, preprod, prod]
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/test_helm_lint.yml@v2
    secrets: inherit
    with:
      environment: ${{ matrix.environment }}

  build:
    name: Build docker image
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/docker_build.yml@v2
    with:
      docker_registry: ghcr.io
      registry_org: ministryofjustice
      push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/hotfix/') }}
      docker_multiplatform: true
    secrets: inherit

  publish_data:
    name: Build and publish data dictionary
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      POSTGRES_DB: interventions_ci
      POSTGRES_PASSWORD: password
      IMAGE: ghcr.io/ministryofjustice/${{ github.event.repository.name }}
      APP_VERSION: ${{ needs.build.outputs.app_version }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: interventions_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: ./.github/actions/setup-flyway
      - name: Migrate the database
        run: flyway migrate -url="jdbc:postgresql://localhost:5432/$POSTGRES_DB" -user="postgres" -password="$POSTGRES_PASSWORD" -locations="src/main/resources/db/migration" -postgresql.transactional.lock=false
      - name: Build data dictionary
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
          dot -V
          script/build-data-dictionary.sh
      - name: Tag docker image
        run: docker tag data-dictionary "$IMAGE:data-dictionary-$APP_VERSION"
      - name: Publish docker image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/hotfix/')
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:data-dictionary-$APP_VERSION"

  deploy_dev:
    name: Deploy to dev
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/hotfix/')
    needs: [validate, validate_db, helm_lint, build, publish_data]
    permissions:
      contents: read
      id-token: write
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_to_env.yml@v2
    secrets: inherit
    with:
      environment: dev
      app_version: ${{ needs.build.outputs.app_version }}
      helm_additional_args: --set image.tag=${{ needs.build.outputs.app_version }}
      show_changelog: false
      slack_notification: "true"

  tag_pact_version_dev:
    name: Tag pact version (dev)
    needs: deploy_dev
    uses: ./.github/workflows/tag-pact-version.yml
    secrets: inherit
    with:
      tag: deployed:dev

  deploy_preprod:
    name: Deploy to preprod
    needs: [build, deploy_dev]
    permissions:
      contents: read
      id-token: write
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_to_env.yml@v2
    secrets: inherit
    with:
      environment: preprod
      app_version: ${{ needs.build.outputs.app_version }}
      helm_additional_args: --set image.tag=${{ needs.build.outputs.app_version }}
      show_changelog: false
      slack_notification: "true"

  tag_pact_version_preprod:
    name: Tag pact version (preprod)
    needs: deploy_preprod
    uses: ./.github/workflows/tag-pact-version.yml
    secrets: inherit
    with:
      tag: deployed:preprod

  # Manual approval is provided by required reviewers on the "prod" GitHub environment
  deploy_prod:
    name: Deploy to prod
    needs: [build, deploy_preprod]
    permissions:
      contents: read
      id-token: write
    uses: ministryofjustice/hmpps-github-actions/.github/workflows/deploy_to_env.yml@v2
    secrets: inherit
    with:
      environment: prod
      app_version: ${{ needs.build.outputs.app_version }}
      helm_additional_args: --set image.tag=${{ needs.build.outputs.app_version }}
      show_changelog: false
      slack_notification: "true"

  tag_pact_version_prod:
    name: Tag pact version (prod)
    needs: deploy_prod
    uses: ./.github/workflows/tag-pact-version.yml
    secrets: inherit
    with:
      tag: deployed:prod
