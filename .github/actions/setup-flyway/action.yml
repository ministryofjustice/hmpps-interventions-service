name: Set up Flyway
description: Installs the Flyway command line client so it is available on the PATH

inputs:
  version:
    description: Flyway command line version
    default: "10.15.2"

runs:
  using: composite
  steps:
    - name: Install Flyway
      shell: bash
      env:
        FLYWAY_VERSION: ${{ inputs.version }}
      run: |
        curl -fsSL "https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz" | tar xz -C "$RUNNER_TEMP"
        sudo ln -s "$RUNNER_TEMP/flyway-${FLYWAY_VERSION}/flyway" /usr/local/bin/flyway
